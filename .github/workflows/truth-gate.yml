# Truth Gate (see TRUTH_GATE.md): fresh lake build + full-log scan + lock audit, in scripts/verify-lock.sh.
name: truth-gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  truth-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (toolchain from lean-toolchain)
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: No-skip guard
        run: python3 scripts/check_no_skips.py
      - name: verify-lock (fresh build, full-log scan, kernel audit)
        run: bash scripts/verify-lock.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: truth-gate-report
          path: truth-gate-report/
