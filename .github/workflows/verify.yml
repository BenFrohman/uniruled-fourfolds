# One runner: elaborate the Lake project, then re-check MukaiLattice.lean
# and the Python copy of the same four rows.
# A green run is not a proof of any geometric statement.
# Any sorry, admit, native_decide or axiom declaration in a tracked .lean file fails the run.

name: Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    name: Lean build, Mukai run, Python cross-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Lean 4.34.1 and build
        uses: leanprover/lean-action@v1
        with:
          build: "true"
          use-mathlib-cache: "false"

      - name: No sorry / admit / native_decide / axiom in any tracked Lean file
        run: python3 certificates/tools/sorry_scan.py

      - name: No-skip guard
        run: python3 scripts/check_no_skips.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Typecheck and run MukaiLattice.lean
        run: ./verify_lean.sh

      - name: Cross-check the same rows in Python
        run: python3 validate_mukai.py

      - name: Render submitted formulas
        run: |
          python3 -m pip install matplotlib
          python3 plots/render_formulas.py

